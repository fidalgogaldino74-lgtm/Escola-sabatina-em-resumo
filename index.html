
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FidalgoIPTV</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090711;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: linear-gradient(120deg, #160a29, #31005c);
    padding: 22px 10px;
    text-align: center;
    border-bottom: 2px solid #a000ff;
}

.logo {
    font-size: 29px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 12px #a000ff;
}

.logo span {
    color: #c000ff;
}

.slogan {
    font-size: 11px;
    color: #d6baff;
    letter-spacing: 3px;
    margin-top: 6px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.player {
    background: #000;
    border: 2px solid #8100d9;
    border-radius: 12px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 15px #51008a;
}

video {
    width: 100%;
    height: 100%;
    background: black;
}

#canalAtual {
    padding: 15px;
    text-align: center;
    color: #d000ff;
    font-weight: bold;
}

.formulario {
    background: #171321;
    border: 1px solid #512078;
    padding: 18px;
    border-radius: 12px;
    margin-top: 20px;
}

h3 {
    color: #d000ff;
    margin-top: 5px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #502078;
    border-radius: 7px;
    background: #241b30;
    color: white;
    outline: none;
}

input:focus {
    border-color: #d000ff;
}

button {
    border: none;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.adicionar {
    background: linear-gradient(90deg, #8100dc, #d000ff);
    color: white;
    width: 100%;
    margin-top: 10px;
}

.lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.canal {
    background: #171321;
    border: 1px solid #512078;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    overflow-wrap: anywhere;
}

.canal strong {
    display: block;
    margin-bottom: 10px;
}

.canal button {
    width: 100%;
    margin-top: 7px;
}

.assistir {
    background: #8c00e6;
    color: white;
}

.excluir {
    background: #b51e40;
    color: white;
}

.vazio {
    color: #aaa;
    text-align: center;
    padding: 20px;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    color: #8d7b9e;
    padding: 25px 10px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">👑 Fidalgo<span>IPTV</span></div>
    <div class="slogan">SUA TV, SEM LIMITES</div>
</header>

<div class="container">

    <div class="player">
        <video id="video" controls playsinline></video>
    </div>

    <div id="canalAtual">
        Selecione um canal para assistir
    </div>

    <div class="formulario">

        <h3>➕ Adicionar novo canal</h3>

        <input
            type="text"
            id="nome"
            placeholder="Nome do canal"
        >

        <input
            type="url"
            id="link"
            placeholder="Cole o link IPTV aqui"
        >

        <button class="adicionar" onclick="adicionarCanal()">
            SALVAR CANAL
        </button>

    </div>

    <h3>📡 Minha lista de canais</h3>

    <div class="lista" id="lista"></div>

</div>

<footer>
    👑 FidalgoIPTV © 2026<br>
    Sua TV, sem limites.
</footer>

<script>

let canais = JSON.parse(
    localStorage.getItem("fidalgoCanais") || "[]"
);

const video = document.getElementById("video");

function salvar() {
    localStorage.setItem(
        "fidalgoCanais",
        JSON.stringify(canais)
    );
}

function adicionarCanal() {

    const nome = document.getElementById("nome").value.trim();
    const link = document.getElementById("link").value.trim();

    if (!nome || !link) {
        alert("Preencha o nome e o link do canal!");
        return;
    }

    try {
        const url = new URL(link);

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error();
        }
    } catch {
        alert("Digite um link válido!");
        return;
    }

    canais.push({
        id: Date.now() + Math.random(),
        nome: nome,
        link: link
    });

    salvar();
    mostrarCanais();

    document.getElementById("nome").value = "";
    document.getElementById("link").value = "";

}

function mostrarCanais() {

    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    if (canais.length === 0) {
        lista.innerHTML =
        '<div class="vazio">Nenhum canal salvo ainda.</div>';
        return;
    }

    canais.forEach(canal => {

        const item = document.createElement("div");
        item.className = "canal";

        const titulo = document.createElement("strong");
        titulo.textContent = canal.nome;

        const assistir = document.createElement("button");
        assistir.className = "assistir";
        assistir.textContent = "▶ ASSISTIR";
        assistir.onclick = () => reproduzir(canal);

        const excluir = document.createElement("button");
        excluir.className = "excluir";
        excluir.textContent = "✖ EXCLUIR";
        excluir.onclick = () => excluirCanal(canal.id);

        item.append(titulo, assistir, excluir);

        lista.appendChild(item);

    });
}

function reproduzir(canal) {

    document.getElementById("canalAtual").textContent =
    "▶ Assistindo: " + canal.nome;

    video.src = canal.link;
    video.load();

    video.play().catch(() => {
        alert(
            "Não foi possível reproduzir este canal. " +
            "Verifique o link e a compatibilidade do formato."
        );
    });

}

function excluirCanal(id) {

    if (!confirm("Deseja excluir este canal?")) return;

    const canalAtual = canais.find(c => c.id === id);

    canais = canais.filter(c => c.id !== id);

    salvar();
    mostrarCanais();

    if (canalAtual && video.getAttribute("src") === canalAtual.link) {

        video.pause();
        video.removeAttribute("src");
        video.load();

        document.getElementById("canalAtual").textContent =
        "Selecione um canal para assistir";
    }
}

// Carregar canais salvos
mostrarCanais();

</script>

</body>
</html>
